<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Better You | Admin</title>
  <style>
    :root {
      --bg: #050505;
      --card: rgba(255,255,255,0.07);
      --card-strong: rgba(255,255,255,0.10);
      --border: rgba(255,255,255,0.14);
      --text: #f7f7f7;
      --muted: rgba(255,255,255,0.68);
      --radius: 28px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(255,210,102,0.18), transparent 24%),
        radial-gradient(circle at 88% 14%, rgba(72,225,216,0.16), transparent 24%),
        radial-gradient(circle at 50% 92%, rgba(255,128,105,0.14), transparent 30%),
        var(--bg);
    }

    .container {
      width: min(100% - 32px, var(--max));
      margin: 0 auto;
      padding: 38px 0 70px;
    }

    .admin-header,
    .login-card,
    .dashboard-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 28px 90px rgba(0,0,0,0.32);
      backdrop-filter: blur(18px);
    }

    .admin-header {
      padding: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .admin-header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .admin-header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .pill {
      padding: 11px 15px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.92);
      font-weight: 800;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      gap: 20px;
    }

    .login-card,
    .dashboard-card {
      padding: clamp(20px, 3vw, 30px);
    }

    .login-card h2,
    .dashboard-card h2 {
      margin: 0 0 12px;
      font-size: 1.7rem;
      letter-spacing: -0.04em;
    }

    .login-card p,
    .dashboard-card p {
      color: var(--muted);
      line-height: 1.7;
    }

    .form {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: #fff;
      padding: 15px 16px;
      outline: none;
      font-size: 1rem;
    }

    select option {
      color: #111;
    }

    input:focus,
    select:focus {
      border-color: rgba(255,255,255,0.42);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.06);
    }

    button {
      border: 1px solid rgba(255,255,255,0.72);
      background: #fff;
      color: #050505;
      border-radius: 999px;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: 0.24s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(255,255,255,0.18);
    }

    .ghost-button {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-color: rgba(255,255,255,0.16);
    }

    .admin-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .message {
      display: none;
      margin-top: 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 14px 16px;
      line-height: 1.6;
    }

    .message.show { display: block; }
    .message.error { background: rgba(255,128,105,0.10); border-color: rgba(255,128,105,0.34); }
    .message.success { background: rgba(72,225,216,0.10); border-color: rgba(72,225,216,0.34); }

    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .search {
      flex: 1 1 280px;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    th,
    td {
      padding: 14px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
      font-size: 0.95rem;
    }

    th {
      color: rgba(255,255,255,0.76);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    td {
      color: rgba(255,255,255,0.94);
    }

    .status-select {
      min-width: 150px;
      padding: 11px 12px;
      border-radius: 14px;
      font-size: 0.92rem;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .meta {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .container {
        width: min(100% - 16px, var(--max));
        padding-top: 18px;
      }

      .admin-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .login-card,
      .dashboard-card {
        padding: 20px 16px;
        border-radius: 24px;
      }

      .toolbar {
        align-items: stretch;
      }

      .search {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="admin-header">
      <div>
        <h1>Panel Admin</h1>
        <p>Solicitudes de “Únete al equipo” para A Better You.</p>
      </div>
      <div class="pill">Temporada Verano</div>
    </section>

    <section class="grid">
      <article class="login-card" id="loginCard">
        <h2>Acceso privado</h2>
        <p>Inicia sesión con el usuario administrador creado en Supabase.</p>

        <form class="form" id="loginForm">
          <label>
            Email
            <input id="adminEmail" type="email" required placeholder="admin@abetteryou.com">
          </label>

          <label>
            Contraseña
            <input id="adminPassword" type="password" required placeholder="••••••••">
          </label>

          <button type="submit">Entrar al panel</button>
        </form>

        <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
      </article>

      <article class="dashboard-card hidden" id="dashboardCard">
        <div class="toolbar">
          <div>
            <h2>Solicitudes recibidas</h2>
            <p class="meta" id="adminIdentity"></p>
          </div>
          <div class="admin-actions">
            <button class="ghost-button" id="refreshBtn" type="button">Actualizar</button>
            <button class="ghost-button" id="logoutBtn" type="button">Cerrar sesión</button>
          </div>
        </div>

        <div class="toolbar">
          <input class="search" id="searchInput" type="search" placeholder="Buscar por nombre, pueblo, email o teléfono">
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Nombre</th>
                <th>Pueblo</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="applicationsBody"></tbody>
          </table>
          <div class="empty hidden" id="emptyState">No hay solicitudes todavía.</div>
        </div>

        <div id="dashboardMessage" class="message" role="status" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/admin-dashboard.js"></script>
</body>
</html>
